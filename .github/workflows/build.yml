name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Static checks
        run: |
          node --check skill/scripts/tramito.mjs
          bash -n package.sh

      - name: SKILL.md frontmatter sanity
        run: |
          grep -q '^name: tramito-bpmn-assistant' skill/SKILL.md
          grep -q '^version: ' skill/SKILL.md
          grep -q '^description: ' skill/SKILL.md
          grep -q '^description_zh: ' skill/SKILL.md
          grep -q '^description_en: ' skill/SKILL.md
          grep -q '^author: ' skill/SKILL.md

      # v2.1 起自包含：内核打包在 skill/scripts/engine.mjs，测试不需要 npm install——
      # 这一步本身就是「沙箱宿主（无 node_modules、无网络）能跑」的证明。
      - name: Smoke — doctor / validate / render (no npm, no network deps)
        run: |
          node skill/scripts/tramito.mjs doctor | grep -q '"ok": true'
          node skill/scripts/tramito.mjs validate examples/expense-approval/expense-approval.graph.json | grep -q '"valid": true'
          node skill/scripts/tramito.mjs render examples/expense-approval/expense-approval.graph.json --out /tmp/smoke --name smoke >/dev/null
          head -c 200 /tmp/smoke/smoke.bpmn | grep -q '<?xml'
          grep -q '<bpmn:definitions' /tmp/smoke/smoke.bpmn

      # 布局输出确定性已验证（同输入字节级一致）：重渲染必须与仓库内基线零 diff。
      # 内核版本随技能发布锁定——基线与打包内核必须一致。
      - name: Regression — re-rendered examples must match committed .bpmn
        run: |
          set -e
          for ex in expense-approval order-fulfillment employee-onboarding procurement; do
            node skill/scripts/tramito.mjs render "examples/$ex/$ex.graph.json" --out /tmp/rerender --name "$ex" >/dev/null
            diff "/tmp/rerender/$ex.bpmn" "examples/$ex/$ex.bpmn" || {
              echo "✗ $ex.bpmn 与打包内核输出不一致——内核升级后未重新生成基线？" >&2
              exit 1
            }
          done

      # 防漂移：按提交在案 engine.mjs 里的 ENGINE_VERSION 重建 bundle，必须与提交文件零 diff。
      # （不用 @latest 重建——内核随技能发布锁定，latest 只在下一步作提示。）
      - name: Bundle drift — rebuild engine.mjs from pinned version
        run: |
          VER=$(grep -o 'ENGINE_VERSION = "[^"]*"' skill/scripts/engine.mjs | head -1 | cut -d'"' -f2)
          echo "committed engine version: $VER"
          node tools/build-engine.mjs "$VER"
          git diff --exit-code -- skill/scripts/engine.mjs || {
            echo '✗ skill/scripts/engine.mjs 与构建脚本输出不一致——请用 tools/build-engine.mjs 重新生成并提交。' >&2
            exit 1
          }

      # 提示性（不阻断）：npm 上已有更新版本的 tramito-layout 时提醒重新打包。
      - name: Engine freshness (advisory)
        run: |
          VER=$(grep -o 'ENGINE_VERSION = "[^"]*"' skill/scripts/engine.mjs | head -1 | cut -d'"' -f2)
          LATEST=$(npm view tramito-layout version)
          echo "bundled: $VER / npm latest: $LATEST"
          [ "$VER" = "$LATEST" ] || echo "::warning::tramito-layout $LATEST is available (bundled: $VER) — re-run tools/build-engine.mjs and cut a new skill release."

      # 编译测试套件：doctor + 5 个场景 fixture（含复杂蛋炒饭：泳道/并行/互斥/返工/io）
      - name: Compile tests (scenario fixtures)
        run: node test/run-tests.mjs

      # 打包本身含凭证泄漏守卫（tmt_live_ 长串即失败）；依赖不进包，用户侧首次运行自动安装
      - name: Package skill zip (WorkBuddy / generic)
        run: ./package.sh

      # OpenAI Skills-only Plugin（.codex-plugin/ + skills/ 布局）；
      # 脚本内置：版本一致性 / 安全检查 / staging 冒烟 / 解压回验（含解压环境 doctor）
      - name: Package OpenAI plugin zip
        run: ./package-openai.sh

      - name: Verify zip layout（SKILL.md 必须在根目录；engine bundle 必须进包）
        run: |
          unzip -l dist/tramito-bpmn-assistant.zip | grep -qE ' SKILL\.md$'
          ! unzip -l dist/tramito-bpmn-assistant.zip | grep -q 'skill/SKILL.md'
          unzip -p dist/tramito-bpmn-assistant.zip SKILL.md | head -1 | grep -q '^---$'
          unzip -l dist/tramito-bpmn-assistant.zip | grep -q 'references/graph-spec.md'
          unzip -l dist/tramito-bpmn-assistant.zip | grep -q 'scripts/tramito.mjs'
          unzip -l dist/tramito-bpmn-assistant.zip | grep -q 'scripts/engine.mjs'
          unzip -l dist/tramito-bpmn-assistant.zip | grep -qE ' package\.json$'
          ! unzip -l dist/tramito-bpmn-assistant.zip | grep -q 'node_modules'
          ! unzip -l dist/tramito-bpmn-assistant.zip | grep -q 'package-lock'

      - uses: actions/upload-artifact@v7
        with:
          name: tramito-bpmn-assistant
          path: dist/*.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # --generate-notes 需要 git 历史，必须先 checkout
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: tramito-bpmn-assistant
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/tramito-bpmn-assistant.zip dist/tramito-bpmn-assistant-openai.zip --title "${GITHUB_REF_NAME}" --generate-notes
